<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Auth Tester</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #1e293b;
        --border: #334155;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --ok: #34d399;
        --err: #f87171;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family:
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          sans-serif;
        background: var(--bg);
        color: var(--text);
        padding: 24px;
        line-height: 1.5;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 1.4rem;
      }
      .subtitle {
        color: var(--muted);
        margin: 0 0 24px;
        font-size: 0.9rem;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      @media (max-width: 720px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 16px;
      }
      .card h2 {
        margin: 0 0 12px;
        font-size: 1rem;
      }
      label {
        display: block;
        font-size: 0.85rem;
        color: var(--muted);
        margin-bottom: 4px;
      }
      input {
        width: 100%;
        padding: 8px 10px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: #0b1220;
        color: var(--text);
        margin-bottom: 10px;
        font-size: 0.95rem;
      }
      button {
        background: var(--accent);
        color: #0b1220;
        border: none;
        border-radius: 6px;
        padding: 8px 14px;
        font-weight: 600;
        cursor: pointer;
        font-size: 0.9rem;
      }
      button.secondary {
        background: var(--border);
        color: var(--text);
      }
      button:hover {
        filter: brightness(1.1);
      }
      .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 12px;
      }
      .token {
        background: #0b1220;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 8px 10px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.8rem;
        word-break: break-all;
        color: var(--ok);
      }
      .token:empty::before {
        content: "— нет токена —";
        color: var(--muted);
      }
      pre {
        background: #0b1220;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 14px;
        overflow: auto;
        max-height: 420px;
        font-size: 0.85rem;
        white-space: pre-wrap;
        word-break: break-word;
        margin-top: 16px;
      }
      .status {
        font-weight: 700;
      }
      .status.ok {
        color: var(--ok);
      }
      .status.err {
        color: var(--err);
      }
    </style>
  </head>
  <body>
    <h1>Auth Tester</h1>
    <p class="subtitle">Форма для ручной проверки всех эндпоинтов /api/auth</p>

    <div class="grid">
      <div class="card">
        <h2>Регистрация</h2>
        <label for="signup-email">Email</label>
        <input id="signup-email" type="email" value="user@example.com" />
        <label for="signup-password">Пароль</label>
        <input id="signup-password" type="password" value="password123" />
        <button id="btn-signup">POST /signup</button>
      </div>

      <div class="card">
        <h2>Вход</h2>
        <label for="login-email">Email</label>
        <input id="login-email" type="email" value="user@example.com" />
        <label for="login-password">Пароль</label>
        <input id="login-password" type="password" value="password123" />
        <button id="btn-login">POST /login</button>
      </div>
    </div>

    <div class="card" style="margin-top: 16px">
      <h2>Access-токен</h2>
      <div class="token" id="token"></div>
      <div class="row">
        <button id="btn-me">GET /me</button>
        <button id="btn-refresh">POST /refresh</button>
        <button class="secondary" id="btn-logout">POST /logout</button>
        <button class="secondary" id="btn-clear">Очистить токен</button>
      </div>
    </div>

    <pre id="output">Ответы появятся здесь</pre>

    <script src="app.js" defer></script>
  </body>
</html>
